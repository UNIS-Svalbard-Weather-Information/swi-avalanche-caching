[project]
name = "swi-avalanche-caching"
version = "0.1.0"
description = "This is a cron task to prepare map layer to display the avalanche forecast"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geojson>=3.2.0",
    "geopandas>=1.1.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pyproj>=3.7.2",
    "rasterio>=1.5.0",
    "requests>=2.32.5",
    "shapely>=2.1.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "ruff>=0.14.10",
]

[tool.ruff.lint]
ignore = [
    # Blind `except Exception` is deliberate here: batch loops over many
    # days/regions log-and-continue on a per-item failure rather than aborting
    # the whole run.
    "BLE001",
    # datetime.now() is used for local "today" boundaries in forecast-date
    # calculations; adding tz= would need a real decision about which
    # timezone the forecast pipeline expects, not something to guess in a
    # lint cleanup.
    "DTZ005",
]
